<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <title>My Task Manager</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20231f;
      --muted: #858981;
      --line: #e9ebe5;
      --paper: #fff;
      --canvas: #f7f7f2;
      --green: #536b45;
      --green-dark: #405438;
      --green-pale: #eef2e9;
      --red: #b54e43;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 64px 20px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 5%, rgba(219, 226, 207, .48), transparent 34rem),
        var(--canvas);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100%, 620px);
      margin: 0 auto;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 12px;
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow-mark {
      display: inline-grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border-radius: 8px;
      background: #e7ecdf;
      font-size: 13px;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 43px);
      font-weight: 680;
      letter-spacing: -.055em;
      line-height: 1.1;
    }

    .subtitle {
      margin: 11px 0 27px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .task-card {
      overflow: hidden;
      border: 1px solid rgba(224, 227, 218, .9);
      border-radius: 18px;
      background: var(--paper);
      box-shadow: 0 18px 55px rgba(49, 57, 39, .07), 0 2px 8px rgba(49, 57, 39, .03);
    }

    .add-form {
      display: flex;
      gap: 10px;
      padding: 20px;
      border-bottom: 1px solid var(--line);
    }

    .add-input, .edit-input {
      width: 100%;
      min-width: 0;
      border: 1px solid #e4e7df;
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: #fbfcf9;
      transition: border-color .16s ease, box-shadow .16s ease;
    }

    .add-input {
      height: 46px;
      padding: 0 14px;
      font-size: 14px;
    }

    .add-input::placeholder, .edit-input::placeholder { color: #a0a49c; }
    .add-input:focus, .edit-input:focus {
      border-color: #8d9e7b;
      box-shadow: 0 0 0 3px rgba(83, 107, 69, .1);
    }

    .add-button {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 91px;
      padding: 0 15px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: var(--green);
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: background .16s ease, transform .16s ease;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: translateY(1px); }
    .add-button span { font-size: 18px; font-weight: 400; line-height: 1; }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 63px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .filter-button {
      padding: 8px 11px;
      border: 0;
      border-radius: 8px;
      color: #777c72;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: color .16s ease, background .16s ease;
    }

    .filter-button:hover { color: var(--ink); background: #f5f6f2; }
    .filter-button[aria-pressed="true"] { color: var(--green-dark); background: var(--green-pale); }

    .total-label {
      color: #a0a49c;
      font-size: 11px;
      white-space: nowrap;
    }

    .task-list {
      margin: 0;
      padding: 4px 20px;
      list-style: none;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 61px;
      border-bottom: 1px solid #f0f1ed;
      animation: appear .2s ease both;
    }

    .task-row:last-child { border-bottom: 0; }

    .task-check {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      margin: 0;
      border: 1.5px solid #cbd0c4;
      border-radius: 6px;
      accent-color: var(--green);
      cursor: pointer;
    }

    .task-text {
      overflow-wrap: anywhere;
      flex: 1;
      padding: 4px 0;
      font-size: 13px;
      line-height: 1.5;
    }

    .task-row.is-complete .task-text {
      color: #a1a59d;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .task-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 3px;
    }

    .icon-button {
      display: grid;
      width: 33px;
      height: 33px;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: #8b9087;
      background: transparent;
      font-size: 15px;
      cursor: pointer;
      transition: color .16s ease, background .16s ease;
    }

    .icon-button:hover { color: var(--green-dark); background: #f3f5f0; }
    .icon-button.delete-button:hover { color: var(--red); background: #fbf1ef; }
    .icon-button:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(83, 107, 69, .3);
      outline-offset: 2px;
    }

    .edit-form {
      display: flex;
      flex: 1;
      gap: 7px;
      padding: 8px 0;
    }

    .edit-input { height: 36px; padding: 0 10px; font-size: 13px; }
    .edit-save, .edit-cancel {
      padding: 0 10px;
      border: 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }
    .edit-save { color: white; background: var(--green); }
    .edit-cancel { color: #777c72; background: #f3f4f1; }

    .empty-state {
      padding: 40px 20px 43px;
      text-align: center;
    }

    .empty-icon {
      display: grid;
      width: 43px;
      height: 43px;
      margin: 0 auto 13px;
      place-items: center;
      border-radius: 14px;
      color: var(--green);
      background: var(--green-pale);
      font-size: 20px;
    }

    .empty-state h2 { margin: 0 0 6px; font-size: 14px; font-weight: 650; }
    .empty-state p { margin: 0; color: var(--muted); font-size: 12px; }

    .list-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 53px;
      padding: 12px 20px;
      border-top: 1px solid var(--line);
      color: #73786f;
      font-size: 12px;
    }

    .remaining-count { color: var(--ink); font-weight: 650; }
    .clear-button {
      padding: 5px 0 5px 8px;
      border: 0;
      color: #8a8f85;
      background: transparent;
      font-size: 11px;
      cursor: pointer;
    }
    .clear-button:hover { color: var(--red); }
    .clear-button:disabled { visibility: hidden; }

    .storage-notice {
      margin: 12px 0 0;
      color: #9a4a3f;
      font-size: 12px;
      line-height: 1.5;
    }
    [hidden] { display: none !important; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 38px 14px; }
      .subtitle { margin-bottom: 21px; }
      .add-form { gap: 8px; padding: 14px; }
      .add-button { min-width: 76px; padding: 0 11px; }
      .list-header { min-height: 59px; padding: 10px 12px; }
      .filters { gap: 0; }
      .filter-button { padding: 8px 9px; font-size: 11px; }
      .total-label { font-size: 10px; }
      .task-list { padding: 3px 13px; }
      .task-row { gap: 9px; min-height: 58px; }
      .task-actions { gap: 0; }
      .icon-button { width: 31px; }
      .list-footer { padding: 11px 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <p class="eyebrow"><span class="eyebrow-mark" aria-hidden="true">✓</span> A little more focused</p>
    <h1>My Task Manager</h1>
    <p class="subtitle">Make room for what matters. One task at a time.</p>

    <section class="task-card" aria-label="Task manager">
      <form class="add-form" id="add-form">
        <label class="visually-hidden" for="new-task">Enter a new task</label>
        <input class="add-input" id="new-task" name="task" type="text" maxlength="200" placeholder="Enter a new task..." autocomplete="off" required>
        <button class="add-button" type="submit"><span aria-hidden="true">+</span> Add task</button>
      </form>

      <div class="list-header">
        <nav class="filters" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </nav>
        <span class="total-label" id="total-label" aria-live="polite"></span>
      </div>

      <ul class="task-list" id="task-list" aria-label="Tasks"></ul>
      <div class="empty-state" id="empty-state" hidden>
        <span class="empty-icon" aria-hidden="true">✦</span>
        <h2 id="empty-title">Nothing on your list yet</h2>
        <p id="empty-description">Add a task above and get started.</p>
      </div>

      <footer class="list-footer">
        <span><strong class="remaining-count" id="remaining-count" aria-live="polite">0</strong> tasks remaining</span>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </footer>
    </section>
    <p class="storage-notice" id="storage-notice" role="status" hidden></p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "my-task-manager.tasks.v1";
      const addForm = document.querySelector("#add-form");
      const newTaskInput = document.querySelector("#new-task");
      const taskList = document.querySelector("#task-list");
      const emptyState = document.querySelector("#empty-state");
      const emptyTitle = document.querySelector("#empty-title");
      const emptyDescription = document.querySelector("#empty-description");
      const remainingCount = document.querySelector("#remaining-count");
      const totalLabel = document.querySelector("#total-label");
      const clearCompletedButton = document.querySelector("#clear-completed");
      const storageNotice = document.querySelector("#storage-notice");
      const filterButtons = [...document.querySelectorAll("[data-filter]")];

      let tasks = [];
      let activeFilter = "all";

      function showStorageError(message) {
        storageNotice.textContent = message;
        storageNotice.hidden = false;
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          storageNotice.hidden = true;
        } catch (error) {
          console.error("Unable to save tasks to localStorage.", error);
          showStorageError("Your changes are visible, but could not be saved in this browser.");
        }
      }

      function loadTasks() {
        try {
          const storedTasks = localStorage.getItem(STORAGE_KEY);
          if (!storedTasks) return;

          const parsedTasks = JSON.parse(storedTasks);
          if (!Array.isArray(parsedTasks) || !parsedTasks.every(task =>
            task && typeof task.id === "string" &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean"
          )) {
            throw new Error("Saved task data has an unexpected format.");
          }
          tasks = parsedTasks;
        } catch (error) {
          console.error("Unable to load saved tasks.", error);
          showStorageError("Saved tasks could not be read. Add a task to start a fresh list.");
          tasks = [];
        }
      }

      function makeId() {
        return typeof crypto !== "undefined" && typeof crypto.randomUUID === "function"
          ? crypto.randomUUID()
          : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      }

      function visibleTasks() {
        if (activeFilter === "active") return tasks.filter(task => !task.completed);
        if (activeFilter === "completed") return tasks.filter(task => task.completed);
        return tasks;
      }

      function createTaskRow(task) {
        const row = document.createElement("li");
        row.className = `task-row${task.completed ? " is-complete" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.className = "task-check";
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `${task.completed ? "Mark" : "Complete"} "${task.text}"`);
        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          saveTasks();
          render();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const editButton = document.createElement("button");
        editButton.className = "icon-button";
        editButton.type = "button";
        editButton.textContent = "✎";
        editButton.setAttribute("aria-label", `Edit "${task.text}"`);
        editButton.addEventListener("click", () => startEditing(task, row));

        const deleteButton = document.createElement("button");
        deleteButton.className = "icon-button delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", `Delete "${task.text}"`);
        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(item => item.id !== task.id);
          saveTasks();
          render();
        });

        actions.append(editButton, deleteButton);
        row.append(checkbox, text, actions);
        return row;
      }

      function startEditing(task, row) {
        const form = document.createElement("form");
        form.className = "edit-form";

        const input = document.createElement("input");
        input.className = "edit-input";
        input.type = "text";
        input.maxLength = 200;
        input.value = task.text;
        input.setAttribute("aria-label", "Edit task");
        input.required = true;

        const saveButton = document.createElement("button");
        saveButton.className = "edit-save";
        saveButton.type = "submit";
        saveButton.textContent = "Save";

        const cancelButton = document.createElement("button");
        cancelButton.className = "edit-cancel";
        cancelButton.type = "button";
        cancelButton.textContent = "Cancel";
        cancelButton.addEventListener("click", render);

        input.addEventListener("keydown", event => {
          if (event.key === "Escape") {
            event.preventDefault();
            render();
          }
        });

        form.addEventListener("submit", event => {
          event.preventDefault();
          const updatedText = input.value.trim();
          if (!updatedText) {
            input.focus();
            return;
          }
          task.text = updatedText;
          saveTasks();
          render();
        });

        form.append(input, saveButton, cancelButton);
        row.replaceChildren(form);
        input.focus();
        input.select();
      }

      function render() {
        const remaining = tasks.filter(task => !task.completed).length;
        const visible = visibleTasks();

        remainingCount.textContent = String(remaining);
        totalLabel.textContent = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"} total`;
        clearCompletedButton.disabled = !tasks.some(task => task.completed);

        filterButtons.forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter));
        });

        taskList.replaceChildren(...visible.map(createTaskRow));
        emptyState.hidden = visible.length > 0;
        if (tasks.length === 0) {
          emptyTitle.textContent = "Nothing on your list yet";
          emptyDescription.textContent = "Add a task above and get started.";
        } else if (activeFilter === "active") {
          emptyTitle.textContent = "You're all caught up";
          emptyDescription.textContent = "There are no active tasks right now.";
        } else {
          emptyTitle.textContent = "No completed tasks yet";
          emptyDescription.textContent = "Finished tasks will show up here.";
        }
      }

      addForm.addEventListener("submit", event => {
        event.preventDefault();
        const text = newTaskInput.value.trim();
        if (!text) {
          newTaskInput.focus();
          return;
        }
        tasks.push({ id: makeId(), text, completed: false });
        saveTasks();
        activeFilter = "all";
        newTaskInput.value = "";
        render();
        newTaskInput.focus();
      });

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          activeFilter = button.dataset.filter;
          render();
        });
      });

      clearCompletedButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        render();
      });

      loadTasks();
      render();
    })();
  </script>
</body>
</html>
